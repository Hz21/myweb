<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>从业人员预防性健康检查合格证明</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0e5fa8',
                        primaryDeep: '#083d70',
                        accent: '#c8102e',
                        gold: '#d4a017',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', '"Microsoft YaHei"', 'sans-serif'],
                    },
                    boxShadow: {
                        card: '0 12px 36px rgba(8, 61, 112, 0.14)',
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background:
                radial-gradient(1000px 500px at 50% -10%, #dbeafe 0%, transparent 55%),
                linear-gradient(160deg, #eef4fa 0%, #e3ecf5 100%);
        }
        .certificate {
            position: relative;
            border-radius: 18px;
        }
        .certificate::before {
            content: '';
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(14, 95, 168, 0.28);
            border-radius: 12px;
            pointer-events: none;
        }
        .watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: 0.4em;
            color: rgba(14, 95, 168, 0.045);
            transform: rotate(-16deg);
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 2.5rem;
        }
        @media (max-width: 640px) {
            .info-grid { grid-template-columns: 1fr; }
        }
        .info-row {
            display: flex;
            align-items: baseline;
            padding: 9px 0;
            border-bottom: 1px dashed rgba(14, 95, 168, 0.18);
        }
        .info-label {
            flex: 0 0 6rem;
            color: #64748b;
            font-size: 0.9rem;
        }
        .info-value {
            flex: 1;
            font-weight: 600;
            color: #1e293b;
            font-size: 0.98rem;
            word-break: break-all;
        }
        /* 圆形钢印章 */
        .stamp {
            position: absolute;
            right: -4px;
            bottom: -6px;
            width: 118px;
            height: 118px;
            border: 3px solid rgba(200, 16, 46, 0.75);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(200, 16, 46, 0.8);
            transform: rotate(-14deg);
            mix-blend-mode: multiply;
            box-shadow: 0 0 0 2px rgba(200,16,46,0.15) inset;
        }
        .stamp::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px dashed rgba(200, 16, 46, 0.5);
            border-radius: 50%;
        }
        .result-badge {
            background: linear-gradient(135deg, #e6f9ee 0%, #d1f2de 100%);
            border: 1px solid #86dfae;
        }
        @media print {
            body { background: #fff; }
        }
    </style>
</head>
